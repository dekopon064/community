name: Manual AI 48-10799 one-off

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: machimoa-ingest-production
  cancel-in-progress: false

jobs:
  ai:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The claim lease is 600 seconds; stop before another worker can reclaim it.
    timeout-minutes: 9
    environment: machimoa-ingest-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install ingest dependencies
        run: python -m pip install -r requirements.txt
      - name: Process only youthcenter_content 48:10799 current revision
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/run_one_off_ai_10799.py --execute
