name: Manual Youthcenter HTTP probe (read-only)

on:
  workflow_dispatch:
    inputs:
      source:
        description: Read exactly one API page without database writes
        required: true
        type: choice
        options:
          - youthcenter_content
          - youthcenter_policy

permissions:
  contents: read

concurrency:
  group: machimoa-ingest-production
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: machimoa-ingest-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install ingest dependencies
        run: python -m pip install -r requirements.txt
      - name: Probe one content page without DB or AI
        if: inputs.source == 'youthcenter_content'
        env:
          YOUTH_CONTENT_API_KEY: ${{ secrets.YOUTH_CONTENT_API_KEY }}
        run: python scripts/run_ingest_architecture.py --source youthcenter_content --execute --probe-one-page
      - name: Probe one policy page without DB or AI
        if: inputs.source == 'youthcenter_policy'
        env:
          YOUTH_API_KEY: ${{ secrets.YOUTH_API_KEY }}
        run: python scripts/run_ingest_architecture.py --source youthcenter_policy --execute --probe-one-page
