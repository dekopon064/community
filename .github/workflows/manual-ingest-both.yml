name: Manual ingest sources

on:
  workflow_dispatch:
    inputs:
      source:
        description: Run both sources or one selected source (up to five pages per source)
        required: true
        default: both
        type: choice
        options:
          - both
          - youthcenter_policy
          - youthcenter_content
      full_scan_once:
        description: Scan up to the configured five pages without the unchanged streak stop
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: machimoa-ingest-production
  cancel-in-progress: false

jobs:
  ingest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: machimoa-ingest-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install ingest dependencies
        id: install
        run: python -m pip install -r requirements.txt
      - name: Ingest and evaluate policy without AI
        id: policy
        if: github.event_name != 'workflow_dispatch' || inputs.source == 'both' || inputs.source == 'youthcenter_policy'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          YOUTH_API_KEY: ${{ secrets.YOUTH_API_KEY }}
          FULL_SCAN_ONCE: ${{ inputs.full_scan_once }}
        run: |
          if [ "$FULL_SCAN_ONCE" = "true" ]; then
            python scripts/run_ingest_architecture.py --source youthcenter_policy --execute --full-scan-once
          else
            python scripts/run_ingest_architecture.py --source youthcenter_policy --execute
          fi
      - name: Ingest and evaluate content without AI
        id: content
        if: always() && steps.install.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.source == 'both' || inputs.source == 'youthcenter_content')
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          YOUTH_CONTENT_API_KEY: ${{ secrets.YOUTH_CONTENT_API_KEY }}
          FULL_SCAN_ONCE: ${{ inputs.full_scan_once }}
        run: |
          if [ "$FULL_SCAN_ONCE" = "true" ]; then
            python scripts/run_ingest_architecture.py --source youthcenter_content --execute --full-scan-once
          else
            python scripts/run_ingest_architecture.py --source youthcenter_content --execute
          fi
      - name: Report selected source outcomes
        if: always()
        env:
          SOURCE_SELECTION: ${{ inputs.source || 'both' }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          CONTENT_OUTCOME: ${{ steps.content.outcome }}
        run: |
          echo "selection=$SOURCE_SELECTION policy=$POLICY_OUTCOME content=$CONTENT_OUTCOME"
          case "$SOURCE_SELECTION" in
            both)
              [ "$POLICY_OUTCOME" = success ] && [ "$CONTENT_OUTCOME" = success ] || exit 1
              ;;
            youthcenter_policy)
              [ "$POLICY_OUTCOME" = success ] && [ "$CONTENT_OUTCOME" = skipped ] || exit 1
              ;;
            youthcenter_content)
              [ "$POLICY_OUTCOME" = skipped ] && [ "$CONTENT_OUTCOME" = success ] || exit 1
              ;;
            *)
              echo 'Invalid source selection.'
              exit 1
              ;;
          esac
